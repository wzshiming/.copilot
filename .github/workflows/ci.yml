name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # actions/runner-images ships shellcheck on Ubuntu but not on macOS
      - if: runner.os == 'macOS'
        run: brew install shellcheck
      # the Makefile runs prettier, markdownlint-cli2, and bats pinned via npx --yes
      - run: make check
